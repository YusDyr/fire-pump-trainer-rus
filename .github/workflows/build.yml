name: Build
# Проверочная сборка при каждом изменении исходников: веб-версия и APK
# выкладываются как артефакт запуска (Actions → запуск → Artifacts), в репозиторий ничего не пишется.
on:
  push:
    branches: [main]
    paths: ['src/**', 'android/**', 'tools/**', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar" >> "$GITHUB_ENV"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"
      - name: Web build
        run: |
          V="$(tr -d ' \n\r' < VERSION)-dev.${GITHUB_RUN_NUMBER}"
          python3 tools/build.py "$(tr -d ' \n\r' < VERSION)"
          echo "V=$V" >> "$GITHUB_ENV"
      - name: APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Секрет ANDROID_KEYSTORE_B64 не задан — APK не собран (см. DEVELOPMENT.md)"; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE="$RUNNER_TEMP/release.jks" OUT="$PWD/NCPK-emulator-$V.apk" bash tools/build_apk.sh
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: NCPK-emulator-${{ env.V }}
          path: |
            NCPK-emulator-*.apk
            emulator/index.html
          if-no-files-found: warn
